version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: myride_api
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=myride_user
      - DB_PASS=myride_password
      - DB_NAME=myride_db
      - JWT_SECRET=super-secret-key-prod
    depends_on:
      db:
        condition: service_started

  db:
    image: postgres:15-alpine
    container_name: myride_db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-password}
      POSTGRES_DB: ${DB_NAME:-myride_mvp}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
